<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Radionette Settings Login</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#e6edf3;font:16px system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:1.2rem}.card{width:min(360px,calc(100% - 2rem));background:#161b22;border:1px solid #30363d;border-radius:12px;padding:1.3rem;margin:auto}h1{font-size:1.35rem;margin-top:.8rem;color:#f0883e}input,button{width:100%;padding:.7rem;margin-top:.6rem;border-radius:7px;border:1px solid #30363d;background:#0d1117;color:#e6edf3;font:inherit}button{background:#9e4f16;cursor:pointer}.error{color:#ffb4ae;min-height:1.3rem;margin-top:.6rem}a{color:#8b949e}
  </style>
  <link rel="stylesheet" href="/app.css">
</head>
<body><header class="app-header"><a class="brand" href="/">RADIONETTE</a><div class="brand-sub">Configuration</div><nav class="tabs"><a class="tab" href="/">Status</a><a class="tab" href="/wifi">WiFi</a><a class="tab" href="/debug">Debug</a><a class="tab active" href="/settings">Settings</a></nav></header><form class="card shell-card" onsubmit="login(event)"><h1>Settings</h1><p>Enter the administration PIN.</p><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4,12}" autocomplete="current-password" autofocus required placeholder="PIN"><button>Unlock settings</button><div class="error" id="error"></div></form>
<script>
async function login(event){event.preventDefault();const error=document.getElementById('error');error.textContent='';try{const r=await fetch('/api/settings/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');location.href='/settings';}catch(e){error.textContent=e.message;document.getElementById('pin').select();}}
</script></body></html>
