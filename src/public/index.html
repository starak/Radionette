<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0e13"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Radionette</title><link rel="stylesheet" href="/app.css">
  <style>
    body{margin:0;min-height:100vh;padding:1.2rem}.dashboard{width:min(1080px,100%);margin:auto}.hero{position:relative;overflow:hidden;padding:clamp(1rem,4vw,2rem);display:grid;grid-template-columns:240px 1fr;gap:clamp(1.2rem,5vw,3rem);align-items:center;min-height:360px}.ambient{position:absolute;inset:-15%;width:130%;height:130%;object-fit:cover;filter:blur(65px) saturate(1.2);opacity:.16;z-index:0}.hero>*:not(.ambient){position:relative;z-index:1}.art-wrap{width:240px;max-width:100%;aspect-ratio:1;position:relative}.art{width:100%;height:100%;object-fit:cover;border-radius:50%;background:#0a0d11;border:1px solid #ffffff18;box-shadow:0 22px 70px #0009,0 0 0 10px #ffffff06}.art-fallback{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:#000;color:#fff;padding:2rem;text-align:center;font-size:clamp(1.15rem,3vw,1.65rem);line-height:1.08;font-weight:800;letter-spacing:.01em}.eyebrow{color:var(--shell-accent);text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:750}.station{font-size:clamp(2rem,6vw,4.4rem);line-height:.98;margin:.45rem 0 .8rem;letter-spacing:-.045em}.track{font-size:clamp(1rem,2.4vw,1.45rem);color:#d7dde6;min-height:1.5em}.sub{color:var(--shell-muted);margin-top:.45rem}.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.3rem}.chip{border:1px solid var(--shell-line);background:#0c1016aa;border-radius:999px;padding:.35rem .65rem;font-size:.76rem;color:var(--shell-muted)}.chip.live{color:var(--shell-green);border-color:#69c28555}.volume{margin-top:1.25rem;display:grid;grid-template-columns:auto 1fr auto;gap:.7rem;align-items:center;color:var(--shell-muted);font-size:.78rem}.volume-track{height:6px;border-radius:99px;background:#ffffff12;overflow:hidden}.volume-fill{height:100%;width:0;background:linear-gradient(90deg,var(--shell-accent),#ffd49e);transition:width .35s}.section-title{margin:1.6rem .25rem .75rem;font-size:.75rem;text-transform:uppercase;letter-spacing:.18em;color:var(--shell-muted)}.bands{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.8rem}.band{padding:1rem}.band h3{margin:0 0 .7rem;color:var(--shell-accent);font-size:.85rem;letter-spacing:.08em;text-transform:uppercase}.station-row{display:flex;gap:.65rem;align-items:center;padding:.5rem .55rem;border-radius:8px;color:var(--shell-muted)}.station-row.active{background:#f09a5415;color:#fff}.station-row .order{font:11px monospace;color:#657080;min-width:30px}.connection{position:fixed;right:.75rem;bottom:.75rem;padding:.38rem .65rem;border:1px solid var(--shell-line);background:#0b0e13dd;border-radius:999px;color:var(--shell-red);font-size:.72rem;z-index:5}.connection.connected{color:var(--shell-green)}
    @media(max-width:720px){body{padding:.7rem}.hero{grid-template-columns:1fr;text-align:center;min-height:0}.art-wrap{width:min(70vw,240px);margin:auto}.chips{justify-content:center}.station{font-size:2.5rem}.volume{text-align:left}}
  </style>
</head>
<body>
  <header class="app-header"><a class="brand" href="/">RADIONETTE</a><div class="brand-sub">Internet radio</div><nav class="tabs"><a class="tab active" href="/">Status</a><a class="tab" href="/wifi">WiFi</a><a class="tab" href="/debug">Debug</a><a class="tab" href="/settings">Settings</a></nav></header>
  <main class="dashboard">
    <section class="hero shell-card">
      <img id="ambient" class="ambient" alt="">
      <div class="art-wrap"><div id="fallback" class="art-fallback">R</div><img id="art" class="art" alt="" style="display:none"></div>
      <div><div id="eyebrow" class="eyebrow">Radio offline</div><h1 id="station" class="station">Radionette</h1><div id="track" class="track">Power is off</div><div id="sub" class="sub">—</div><div class="chips"><span id="play-chip" class="chip">Stopped</span><span id="mode-chip" class="chip">Off</span><span id="audio-chip" class="chip">Mono</span><span id="display-chip" class="chip">Display</span></div><div class="volume"><span>Volume</span><div class="volume-track"><div id="volume-fill" class="volume-fill"></div></div><b id="volume-value">0%</b></div></div>
    </section>
    <div class="section-title">Stations</div><section id="bands" class="bands"></section>
  </main>
  <div id="connection" class="connection">Disconnected</div>
  <script>
    const $=id=>document.getElementById(id);let ws,reconnect,lastArt='';
    function connect(){const proto=location.protocol==='https:'?'wss:':'ws:';ws=new WebSocket(`${proto}//${location.host}/`);ws.onopen=()=>{$('connection').textContent='Live';$('connection').className='connection connected';clearTimeout(reconnect)};ws.onclose=()=>{$('connection').textContent='Reconnecting';$('connection').className='connection';reconnect=setTimeout(connect,2000)};ws.onerror=()=>ws.close();ws.onmessage=e=>{try{const s=JSON.parse(e.data);if(s.type==='state')render(s)}catch(err){console.error(err)}}}
    function logoUrl(s){if(s.nowPlayingArtwork?.url&&['auto-artwork','always-artwork'].includes(s.displayMode))return s.nowPlayingArtwork.url;if(s.mode==='bluetooth')return s.bluetoothDevice?'/logos/bluetooth-connected.png':'/logos/bluetooth.png';if(s.channel)return s.channel.logo?'/logos/'+encodeURIComponent(s.channel.logo):null;return'/logos/default.png'}
    function setArtwork(url,name){const key=url||`text:${name}`;if(key===lastArt)return;lastArt=key;const art=$('art'),ambient=$('ambient'),fallback=$('fallback');fallback.textContent=(name||'Radionette').trim();art.style.display='none';if(!url){fallback.style.display='grid';art.removeAttribute('src');ambient.removeAttribute('src');return}art.onload=()=>{art.style.display='block';fallback.style.display='none';ambient.src=url};art.onerror=()=>{art.style.display='none';fallback.style.display='grid';art.removeAttribute('src');ambient.removeAttribute('src')};art.src=url}
    function render(s){const powered=!!s.power,radio=s.mode==='radio';let station='Radionette',track='Power is off',sub='—',eyebrow='Radio offline';if(powered&&s.mode==='bluetooth'){station=s.bluetoothDevice||'Bluetooth';track=s.bluetoothDevice?'Connected and ready':'Waiting for a device…';sub='Wireless speaker mode';eyebrow='Bluetooth'}else if(powered&&radio&&s.channel){station=s.channel.name;track=s.metadata||'Waiting for now-playing information…';sub=s.nowPlayingArtwork?`${s.nowPlayingArtwork.artist} · ${s.nowPlayingArtwork.title}`:'Internet radio';eyebrow=s.playing?'Now playing':'Tuned'}else if(powered){track='No station selected';eyebrow='Radio'}$('station').textContent=station;$('track').textContent=track;$('sub').textContent=sub;$('eyebrow').textContent=eyebrow;setArtwork(logoUrl(s),station);$('play-chip').textContent=s.playing?'● Playing':'Stopped';$('play-chip').className='chip'+(s.playing?' live':'');$('mode-chip').textContent=s.mode==='bluetooth'?'Bluetooth':s.mode==='radio'?'Radio':'Off';$('audio-chip').textContent=s.mono?'Mono':'Stereo';$('display-chip').textContent=(s.displayMode||'display').replaceAll('-',' ');$('volume-fill').style.width=(s.volume||0)+'%';$('volume-value').textContent=(s.volume||0)+'%';renderStations(s)}
    function renderStations(s){const root=$('bands');root.innerHTML='';const bands=Array.isArray(s.bands)?s.bands:[];for(const band of bands){const channels=(s.channels||[]).filter(c=>c.band===band.ordinal).sort((a,b)=>a.order-b.order);if(!channels.length)continue;const box=document.createElement('div');box.className='band shell-card';const h=document.createElement('h3');h.textContent=band.name;box.appendChild(h);for(const ch of channels){const row=document.createElement('div');row.className='station-row'+(s.channel?.id===ch.id?' active':'');const order=document.createElement('span');order.className='order';order.textContent=ch.order;const name=document.createElement('span');name.textContent=ch.name;row.append(order,name);box.appendChild(row)}root.appendChild(box)}}
    connect();
  </script>
</body></html>
