    <text transform="matrix(1 0 0 1 40 61)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="30" fill="#ffffff"><tspan x="0" y="0">RADIONETTE — GC9A01 DISPLAY VARIANTS</tspan></text>
    <text transform="matrix(1 0 0 1 40 84)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#cbd5e1"><tspan x="0" y="0">Existing bare panel and optional 8-pin PCB module</tspan></text>
    <text transform="matrix(1 0 0 1 65 169)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="21" fill="#1d4ed8"><tspan x="0" y="0">A — EXISTING BARE 14/15-PIN PANEL</tspan></text>
    <text transform="matrix(1 0 0 1 850 169)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="21" fill="#6d28d9"><tspan x="0" y="0">B — OPTIONAL 8-PIN PCB MODULE</tspan></text>
    <text transform="matrix(1 0 0 1 70 197)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="13" fill="#64748b"><tspan x="0" y="0">As built: backlight connected directly; no MOSFET</tspan></text>
    <text transform="matrix(1 0 0 1 850 197)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="13" fill="#64748b"><tspan x="0" y="0">GC9A01 • 240×240 • 2.8–3.3 V • 4-wire SPI</tspan></text>
    <text transform="matrix(1 0 0 1 70 244)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="17" fill="#1d4ed8"><tspan x="0" y="0">RASPBERRY PI</tspan></text>
    <text transform="matrix(1 0 0 1 460 244)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="17" fill="#c2410c"><tspan x="0" y="0">BARE PANEL</tspan></text>
