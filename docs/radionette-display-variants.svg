    <text transform="matrix(1 0 0 1 865 475)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#334155"><tspan x="0" y="0">BCM 22 / pin 15</tspan></text>
    <text transform="matrix(1 0 0 1 1265 475)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#334155"><tspan x="0" y="0">RES</tspan></text>
    <text transform="matrix(1 0 0 1 865 525)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#334155"><tspan x="0" y="0">BCM 27 / pin 13</tspan></text>
    <text transform="matrix(1 0 0 1 1265 525)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#334155"><tspan x="0" y="0">DC</tspan></text>
    <text transform="matrix(1 0 0 1 865 575)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#334155"><tspan x="0" y="0">BCM 8 / pin 24</tspan></text>
    <text transform="matrix(1 0 0 1 1265 575)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#334155"><tspan x="0" y="0">CS</tspan></text>
    <text transform="matrix(1 0 0 1 865 625)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#1d4ed8"><tspan x="0" y="0">BCM 13 / pin 33</tspan></text>
    <text transform="matrix(1 0 0 1 1265 625)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="14" fill="#1d4ed8"><tspan x="0" y="0">BLK</tspan></text>
    <text transform="matrix(1 0 0 1 465 635)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="13" fill="#64748b"><tspan x="0" y="0">Pins 10–15 TP-*</tspan></text>
    <text transform="matrix(1 0 0 1 465 659)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="13" fill="#64748b"><tspan x="0" y="0">leave unconnected</tspan></text>
    <text transform="matrix(1 0 0 1 65 849)" x="0" y="0" xml:space="preserve" font-family="Inter" font-size="21" fill="#334155"><tspan x="0" y="0">INSTALLATION NOTES</tspan></text>
    <text transform="matrix(1 0 0 1 65 876)" x="0" y="14.531" xml:space="preserve" font-family="Inter" font-size="15" fill="#334155"><tspan x="0" y="14.531">• Power the Pi off before changing display wiring.</tspan><tspan x="0" y="32.531">• Both variants use the same SPI, DC and reset signals.</tspan><tspan x="0" y="50.531">• GPIO 13 is active HIGH: on while HIGH, off while LOW.</tspan><tspan x="0" y="68.531">• Software auto-off is 20 seconds after the last visible event.</tspan></text>
    <text transform="matrix(1 0 0 1 825 876)" x="0" y="14.531" xml:space="preserve" font-family="Inter" font-size="15" fill="#334155"><tspan x="0" y="14.531">• Use 3.3 V only; the new module is specified for 2.8–3.3 V.</tspan><tspan x="0" y="32.531">• Existing bare panel is documented exactly as built: LEDA directly to GPIO 13 and LEDK to GND.</tspan><tspan x="0" y="50.531">• Before duplicating the bare-panel wiring, verify backlight current is within GPIO limits.</tspan></text>
  </g>
</svg>
